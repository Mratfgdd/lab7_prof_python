[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "student-manager"
version = "0.7.0"
description = "Laboratory work 7 (Professional Python): student records with SQLite persistence"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Nazar Levandivskyi" }]
dependencies = ["sqlalchemy>=2.0", "alembic>=1.13"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-cov>=5"]
dev = ["pytest>=8", "pytest-cov>=5", "mypy>=1.10", "ruff>=0.5"]

[project.scripts]
student-manager = "student_manager.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".*", "*.egg-info", "build", "dist", "experiments", "report", "results", "migrations", "tools"]
pythonpath = ["src"]
addopts = ["-ra", "--strict-markers"]

[tool.coverage.run]
branch = true
source = ["student_manager"]

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_also = ['if __name__ == "__main__":']

[tool.coverage.html]
directory = "htmlcov"

[tool.mypy]
strict = true
mypy_path = "src"
files = ["src", "tests", "migrations", "experiments", "tools"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "."]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "PT"]

[tool.ruff.lint.per-file-ignores]
"experiments/*" = ["E402"]
"report/*" = ["E402", "E501"]
